# ============================================================
# BovinNet - Módulo Gestión de Bovinos
# Configuración de la aplicación Spring Boot
# ============================================================

# Nombre de la aplicación
spring.application.name=gestion-bovinos

# Puerto del servidor embebido (Tomcat)
server.port=8080

# Base de datos embebida H2 (en memoria). Se usa para que el módulo
# pueda ejecutarse y probarse sin necesidad de instalar un motor de
# base de datos externo. El modelo de tabla replica el diseño
# relacional de la evidencia GA6-220501096-AA1-EV01/EV02.
spring.datasource.url=jdbc:h2:mem:bovinetdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, útil para inspeccionar los datos durante las
# pruebas: disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate crea/actualiza automáticamente las tablas a partir de las
# entidades anotadas (@Entity) y muestra el SQL generado en la consola,
# útil para las pruebas de validación de la evidencia EV02.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datos de ejemplo precargados al iniciar la aplicación (ver data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Idioma de los mensajes de validación
spring.mvc.locale=es_CO
